<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <!-- SPDX-License-Identifier: GPL-3.0-only -->
  <title id="title">Shiraz — Your Android™ apps. A little more at home.</title>
  <desc id="desc">Native Android compatibility layer for Linux and Apple Silicon macOS. No virtual machine, no full Android system, GTK-free.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b0f1c"/>
      <stop offset="100%" stop-color="#200a14"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="0.84" cy="0.16" r="0.62">
      <stop offset="0%" stop-color="#521d36" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#521d36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5d8f" stop-opacity="0.36"/>
      <stop offset="34%" stop-color="#f9b233" stop-opacity="0.22"/>
      <stop offset="68%" stop-color="#25c4b4" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#4f6df0" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="1198" height="378" rx="20"/>
    </clipPath>
    <clipPath id="archClip">
      <path d="M 981 243 V 101 A 70 70 0 0 1 1121 101 V 243 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="1198" height="378" rx="20" fill="url(#cardBg)"/>
    <rect x="1" y="1" width="1198" height="378" fill="url(#warmGlow)"/>

    <!-- Orsi stained-glass window and refracted desktop light -->
    <path d="M 982 86 L 1120 246 L 1008 350 L 744 348 L 746 190 Z" fill="url(#beamGrad)"/>
    <ellipse cx="1051" cy="136" rx="95" ry="110" fill="#ff5d8f" opacity="0.14"/>

    <!-- Arched Orsi frame -->
    <path d="M 976 248 V 101 A 75 75 0 0 1 1126 101 V 248 Z" fill="#12050b" stroke="#f7ecdc" stroke-opacity="0.18" stroke-width="1.5"/>
    <g clip-path="url(#archClip)">
      <!-- Row 0 -->
      <rect x="983" y="33" width="42" height="38" rx="3" fill="#ff5d8f"/>
      <rect x="1030" y="33" width="42" height="38" rx="3" fill="#f9b233"/>
      <rect x="1077" y="33" width="42" height="38" rx="3" fill="#ff5d8f"/>
      <!-- Row 1 -->
      <rect x="983" y="75" width="42" height="38" rx="3" fill="#25c4b4"/>
