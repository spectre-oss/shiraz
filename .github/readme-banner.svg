    <!-- Desktop window receiving the light -->
    <rect x="742" y="186" width="270" height="166" rx="12" fill="#1d0912" fill-opacity="0.95" stroke="#f7ecdc" stroke-opacity="0.28" stroke-width="1.25"/>
    <line x1="742" y1="210" x2="1012" y2="210" stroke="#f7ecdc" stroke-opacity="0.14" stroke-width="1"/>
    <circle cx="758" cy="198" r="3.5" fill="#f7ecdc" fill-opacity="0.32"/>
    <circle cx="771" cy="198" r="3.5" fill="#f7ecdc" fill-opacity="0.32"/>
    <circle cx="784" cy="198" r="3.5" fill="#f7ecdc" fill-opacity="0.32"/>

