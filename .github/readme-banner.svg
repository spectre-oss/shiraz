    <!-- Row 0 -->
    <rect x="752" y="219" width="46" height="38" rx="4" fill="#ff5d8f"/>
    <rect x="803" y="219" width="46" height="38" rx="4" fill="#25c4b4"/>
    <rect x="854" y="219" width="46" height="38" rx="4" fill="#f9b233"/>
    <rect x="905" y="219" width="46" height="38" rx="4" fill="#4f6df0"/>
    <rect x="956" y="219" width="46" height="38" rx="4" fill="#25c4b4"/>
    <!-- Row 1 -->
    <rect x="752" y="262" width="46" height="38" rx="4" fill="#f9b233"/>
    <rect x="803" y="262" width="46" height="38" rx="4" fill="#4f6df0"/>
    <rect x="854" y="262" width="46" height="38" rx="4" fill="#ff5d8f"/>
    <rect x="905" y="262" width="46" height="38" rx="4" fill="#3fbf78"/>
    <rect x="956" y="262" width="46" height="38" rx="4" fill="#f9b233"/>
    <!-- Row 2 -->
    <rect x="752" y="305" width="46" height="38" rx="4" fill="#ff5d8f"/>
    <rect x="803" y="305" width="46" height="38" rx="4" fill="#25c4b4"/>
    <rect x="854" y="305" width="46" height="38" rx="4" fill="#f9b233"/>
    <rect x="905" y="305" width="46" height="38" rx="4" fill="#4f6df0"/>
    <rect x="956" y="305" width="46" height="38" rx="4" fill="#25c4b4"/>

    <!-- Brand lockup (Spectre ghost mirrored + shiraz wordmark) -->
    <g transform="translate(102 46) scale(-0.09375 0.09375)">
      <g fill="#f7ecdc" transform="translate(83.2 100) scale(1.6)">
        <path d="M97.5 10a53 53 0 0 0-43.4 38.7C53 52.1 50.7 63.1 49 73.2c-3.2 19-5.5 25.6-9.3 27.7-2.6 1.4-3.8 1.5-13.8.5-8.6-.8-11 .1-13.9 4.9-2.6 4.1-2.5 9.2.1 16.2 2 5.5 9.1 15.5 10.9 15.5s1-3.6-1.1-5.6c-5.8-5.2-9.9-16.9-8-22.7 1.6-4.8 4.7-6.2 11.8-5.2 18.5 2.5 21.3-.6 26.2-29.6 1.7-9.6 4.2-21.1 5.5-25.5a51 51 0 0 1 27.3-32.1c6.6-3.2 8.7-3.7 17.3-4.1 11.7-.6 18.2.8 26.6 5.4a52 52 0 0 1 18.9 19.5c1.4 2.6 4.5 10.6 6.9 17.7s5.6 15.2 7 18.1c6 11.7 15.1 18.1 25.9 18.1 3.2 0 7.1.7 8.7 1.5 8.2 4.2 8.5 17.2.9 32.1-3.9 7.6-4.3 11-.9 7.9a59 59 0 0 0 9.1-20.9c1.7-8.2 0-15.5-4.7-19.5-3.8-3.4-4.9-3.7-14.2-4.5-7.4-.7-10.6-2.1-15.4-7.2-5.1-5.2-8-10.9-13.2-26.2-2.5-7.4-6-16.1-7.8-19.4A51 51 0 0 0 97.5 10"/>
        <path d="M75.6 54.2c-3.1 4.4-1.3 10.8 3 10.8 4 0 6.1-8.2 2.8-11.4q-3.1-3.3-5.8.6m30.6-1.4c-1.9 1.3-3.2 7-2.2 9.7 2.7 7.1 10 1.7 7.9-5.9q-1.8-6-5.7-3.8M79 80.3c0 4.5 9.1 9.4 15.6 8.4 4.9-.8 11.4-5.2 11.4-7.7q.1-4-4 .5a13.5 13.5 0 0 1-19 0q-4-4.2-4-1.2m108 52.2c0 2.5.9 6.8 2 9.7s2 6.6 2 8.3c0 4.9-4 10.7-9 13.3-3.9 2.1-5.5 2.3-12.1 1.8-10.1-.7-13.9.5-19.1 6a47 47 0 0 1-8.8 7.2c-3.8 2.3-5.6 2.7-12 2.6-6.2 0-8.8-.6-14.7-3.2-9.7-4.3-16.4-4.3-27-.1a63 63 0 0 1-12.3 3.6A19 19 0 0 1 54.5 168c-2.7-8.3-4.6-10-11.7-10-6.6 0-11.3-1.9-12.3-5.1-.4-1.1-.4-5.6 0-9.9.7-8 .1-12.4-1.6-11.8a69 69 0 0 0-2.2 19.1c0 3.3 3 7.7 6.4 9.4 1.3.7 5.2 1.3 8.5 1.3 7 0 7.4.3 9.9 7.9 5 15.4 19.4 20 38.5 12.2 10-4 15.1-4 24.3.1q15.5 6.7 27 1.5a35 35 0 0 0 9.3-6.7c5.8-6.2 8-7 18.9-7 10.6 0 14.7-1.4 19.7-6.7 5.2-5.5 6.1-11.9 2.8-20.5a33 33 0 0 1-2-9.6c0-3.1-.4-4.2-1.5-4.2s-1.5 1.2-1.5 4.5"/>
      </g>
    </g>
    <text x="114" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.5" fill="#f7ecdc">shiraz</text>

    <!-- Display headline -->
    <text x="60" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1" fill="#f7ecdc">Your Android<tspan baseline-shift="super" font-size="16" font-weight="500" letter-spacing="0" fill="#d6c0bd">™</tspan> apps.</text>
    <text x="60" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1" fill="#f7ecdc">A little more at home.</text>

    <!-- Subtitle -->
    <text x="60" y="264" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#d6c0bd">Native Android™ compatibility for Linux and Apple Silicon macOS.</text>
    <text x="60" y="290" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#b59da0">No virtual machine. No full Android™ system. GTK-free.</text>

    <!-- Bottom accent line -->
    <circle cx="66" cy="329" r="4" fill="#f4b63f"/>
    <text x="80" y="334" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#d6c0bd">Open source · GPL-3.0-only · ART + SDL + EGL/GLES · Experimental</text>
