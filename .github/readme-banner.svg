      <rect x="1077" y="117" width="42" height="38" rx="3" fill="#f9b233"/>
      <!-- Row 3 -->
      <rect x="983" y="159" width="42" height="38" rx="3" fill="#4f6df0"/>
      <rect x="1030" y="159" width="42" height="38" rx="3" fill="#3fbf78"/>
      <rect x="1077" y="159" width="42" height="38" rx="3" fill="#4f6df0"/>
      <!-- Row 4 -->
      <rect x="983" y="201" width="42" height="38" rx="3" fill="#25c4b4"/>
      <rect x="1030" y="201" width="42" height="38" rx="3" fill="#f9b233"/>
      <rect x="1077" y="201" width="42" height="38" rx="3" fill="#25c4b4"/>
      <rect x="981" y="31" width="140" height="212" fill="url(#glassSheen)"/>
