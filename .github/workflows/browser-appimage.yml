name: Shiraz prerelease and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shiraz-release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Commit Conventional Commit version bump
        id: bump
        run: python3 scripts/ci_version.py --apply

  build:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      SHIRAZ_BUILD_JOBS: '4'
      TMPDIR: /home/runner/shiraz-tmp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Prepare temporary directory
        run: mkdir -p "$TMPDIR"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-wasm/go.mod
          cache: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential ca-certificates cmake flex \
            gettext git libasound2-dev libcairo2-dev libdbus-1-dev libegl1-mesa-dev \
            libfontconfig1-dev libfreetype-dev libgbm-dev libgles2-mesa-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev \
            libharfbuzz-dev libicu-dev libjpeg-dev libopus-dev libpng-dev \
            libsndfile1-dev libsqlite3-dev libtool libudev-dev libwebp-dev libx11-dev \
            libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev meson ninja-build openjdk-17-jdk \
            pkg-config python3 python3-venv ripgrep xz-utils zlib1g-dev
          mkdir -p "$TMPDIR"
      - name: Build fixture and runtime
        run: |
          make deps
          make build
          make apk-fixture
          make appimage APK=build/apk-fixture/fixture.apk NAME=Shiraz-CI-Fixture AOT=0
      - name: Build generic base and WebAssembly assembler
        run: |
          python3 scripts/make_runtime_template.py \
            build/appimage/org.shiraz.fixture.AppDir build/runtime-template.tar.gz
          (cd go-wasm/launcher && go build -o ../../build/shiraz-payload-launcher .)
          version=$(cat VERSION)
          python3 scripts/make_browser_base.py \
            build/runtime-template.tar.gz build/shiraz-payload-launcher \
            "dist/Shiraz-Browser-Base-${version}-x86_64.AppImage"
          (cd go-wasm && GOOS=js GOARCH=wasm go build -o shiraz-assemble.wasm .)
          python3 go-wasm/bootstrap_font.py
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" go-wasm/wasm_exec.js
          python3 scripts/package_browser_site.py
      - name: Verify browser kit
        run: |
          version=$(cat VERSION)
          test "$version" = "${{ needs.version.outputs.version }}"
          test -s "dist/Shiraz-Browser-Base-${version}-x86_64.AppImage"
          test -s "dist/Shiraz-Browser-Builder-${version}.zip"
          test -s go-wasm/shiraz-assemble.wasm
          (cd dist && sha256sum -c "Shiraz-Browser-Base-${version}-x86_64.AppImage.sha256")
          node --max-old-space-size=4096 go-wasm/verify_kit.cjs
      - name: Upload run artifact
        uses: actions/upload-artifact@v7
        with:
          name: shiraz-browser-kit-${{ needs.version.outputs.version }}-x86_64
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/Shiraz-Browser-Base-*-x86_64.AppImage
            dist/Shiraz-Browser-Base-*-x86_64.AppImage.sha256
            dist/Shiraz-Browser-Builder-*.zip
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          version=$(cat VERSION)
          tag="v${version}"
          base="dist/Shiraz-Browser-Base-${version}-x86_64.AppImage"
          checksum="${base}.sha256"
          builder="dist/Shiraz-Browser-Builder-${version}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$base" "$checksum" "$builder" --clobber
          else
            gh release create "$tag" "$base" "$checksum" "$builder" \
              --target "$RELEASE_SHA" --title "Shiraz ${version}" --prerelease \
              --notes "Prebuilt x86_64 Shiraz base AppImage and browser WASM assembler. App compatibility is experimental."
          fi
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
