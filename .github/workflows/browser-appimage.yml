name: Shiraz prerelease and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shiraz-release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Commit Conventional Commit version bump
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_version.py --apply

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            deb_arch: amd64
            loader: ld-linux-x86-64.so.2
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            loader: ld-linux-aarch64.so.1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      SHIRAZ_ARCH: ${{ matrix.arch }}
      JAVA_DEB_ARCH: ${{ matrix.deb_arch }}
      SHIRAZ_BUILD_JOBS: '4'
      TMPDIR: /home/runner/shiraz-tmp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Prepare temporary directory
        run: mkdir -p "$TMPDIR"
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential ca-certificates cmake flex \
            gettext git libasound2-dev libcairo2-dev libcap-dev libdbus-1-dev libegl1-mesa-dev \
            libelf-dev libfontconfig1-dev libfreetype-dev libgbm-dev libgles2-mesa-dev libmd-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev \
            libharfbuzz-dev libicu-dev libjpeg-dev libopus-dev libpng-dev \
            libsndfile1-dev libsqlite3-dev libtool libudev-dev libvixl-dev libwebp-dev libx11-dev \
            libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev meson ninja-build openjdk-17-jdk \
            pkg-config python3 python3-venv ripgrep weston xz-utils zlib1g-dev
          mkdir -p "$TMPDIR"
      - uses: actions/cache@v4
        with:
          path: .local/share/shiraz/fonts
          key: shiraz-fonts-${{ hashFiles('scripts/bootstrap_fonts.py') }}
      - name: Prepare verified fonts
        run: python3 scripts/bootstrap_fonts.py
      - name: Build fixture and runtime
        run: |
          nix develop -c bash -euo pipefail -c '
            # ART links against Ubuntu libraries; use Ubuntu Java for JNI.
            export PATH="/usr/lib/jvm/java-17-openjdk-${JAVA_DEB_ARCH}/bin:$PATH"
            make deps
            make runtime-art
            make build
            make apk-fixture
            make appimage APK=build/apk-fixture/fixture.apk NAME=Shiraz-CI-Fixture AOT=0
          '
      - name: Smoke test packaged Wayland renderer
        run: |
          export XDG_RUNTIME_DIR="$TMPDIR/wayland"
          export XDG_CACHE_HOME="$TMPDIR/fixture-cache"
          export SDL_VIDEODRIVER=wayland
          export WAYLAND_DISPLAY=shiraz-ci
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_CACHE_HOME"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --renderer=pixman --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 --log="$TMPDIR/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          appdir="$PWD/build/appimage/org.shiraz.fixture.AppDir"
          test -s "$appdir/usr/lib/libEGL_mesa.so.0"
          test -s "$appdir/usr/lib/swrast_dri.so"
          g++ -I "$PWD/.local/include/SDL2" -D_REENTRANT \
            tests/packaged_wayland.cpp -o "$TMPDIR/packaged-wayland" \
            -L "$appdir/usr/lib" -Wl,-rpath-link,"$appdir/usr/lib" \
            -Wl,--allow-shlib-undefined -lshiraz-jni
          export LIBGL_ALWAYS_SOFTWARE=1
          export LIBGL_DRIVERS_PATH="$appdir/usr/lib"
          export __EGL_VENDOR_LIBRARY_FILENAMES="$appdir/usr/share/glvnd/egl_vendor.d/50_mesa.json"
          timeout 30s "$appdir/usr/lib/${{ matrix.loader }}" \
            --library-path "$appdir/usr/lib" "$TMPDIR/packaged-wayland"
      - name: Build generic base and WebAssembly assembler
        run: |
          nix develop -c bash -euo pipefail -c '
            python3 scripts/make_runtime_template.py \
              build/appimage/org.shiraz.fixture.AppDir build/runtime-template.tar.gz
            (cd go-wasm/launcher && go build -o ../../build/shiraz-payload-launcher .)
            version=$(cat VERSION)
            python3 scripts/make_browser_base.py \
              build/runtime-template.tar.gz build/shiraz-payload-launcher \
              "dist/Shiraz-Browser-Base-${version}-${SHIRAZ_ARCH}.AppImage"
            (cd go-wasm && GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./... && GOOS=js GOARCH=wasm go build -o shiraz-assemble.wasm .)
            python3 go-wasm/bootstrap_font.py
            cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" go-wasm/wasm_exec.js
          '
      - name: Verify browser kit
        run: |
          version=$(cat VERSION)
          test "$version" = "${{ needs.version.outputs.version }}"
          test -s "dist/Shiraz-Browser-Base-${version}-${SHIRAZ_ARCH}.AppImage"
          test -s go-wasm/shiraz-assemble.wasm
          (cd dist && sha256sum -c "Shiraz-Browser-Base-${version}-${SHIRAZ_ARCH}.AppImage.sha256")
          nix develop -c node --max-old-space-size=4096 go-wasm/verify_kit.cjs
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum
      - name: Build Debian web package
        if: matrix.arch == 'x86_64'
        run: |
          (cd go-server && go test ./... && CGO_ENABLED=0 go build -o ../build/shiraz-web .)
          python3 packaging/prepare_deb_python.py \
            build/appimage/org.shiraz.fixture.AppDir build/deb-python
          version=$(cat VERSION)
          python3 packaging/build_deb.py \
            --source-root . --runtime-root . --private-python build/deb-python \
            --system-ffmpeg --output "dist/shiraz-web_${version}-1_amd64.deb"
          (cd dist && sha256sum "shiraz-web_${version}-1_amd64.deb" > "shiraz-web_${version}-1_amd64.deb.sha256")
      - name: Verify Debian package on Debian 12 and 13
        if: matrix.arch == 'x86_64'
        run: |
          version=$(cat VERSION)
          deb="dist/shiraz-web_${version}-1_amd64.deb"
          dpkg-deb --contents "$deb" | awk '$6 ~ /\.apk$/ && $6 != "./opt/shiraz/build/framework-res/framework-res.apk" { print; bad=1 } END { exit bad }'
          for suite in bookworm trixie; do
            docker run --rm -v "$PWD/dist:/packages:ro" "debian:$suite" sh -ec '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends curl /packages/'"$(basename "$deb")"' >/dev/null
              dpkg -s shiraz-web | grep -q "^Status: install ok installed$"
              test "$(stat -c %U:%G:%a /opt/shiraz/data/state)" = "shiraz:shiraz:700"
              grep -Fq "Environment=XDG_STATE_HOME=/opt/shiraz/data/state" /lib/systemd/system/shiraz-web.service
              su -s /bin/sh shiraz -c "test -w /opt/shiraz/data/state && touch /opt/shiraz/data/state/.ci-write-test"
              loader=/opt/shiraz/python/lib/ld-linux-x86-64.so.2
              art=/opt/shiraz/context/art_standalone/out/host/linux-x86
              runtime_libs="$art/lib64:/opt/shiraz/.local/lib:/opt/shiraz/build:/opt/shiraz/python/lib"
              "$loader" --library-path "$runtime_libs" --list "$art/bin/dalvikvm" > /tmp/art-libraries.txt
              grep -F "libstdc++.so.6 => /opt/shiraz/python/lib/libstdc++.so.6" /tmp/art-libraries.txt
              /usr/bin/shiraz-web -listen 127.0.0.1:18080 >/tmp/shiraz-web.log 2>&1 &
              server_pid=$!
              trap "kill $server_pid 2>/dev/null || true" EXIT
              curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 \
                http://127.0.0.1:18080/ >/dev/null || { cat /tmp/shiraz-web.log; exit 1; }
            '
          done
          (cd dist && sha256sum -c "$(basename "$deb").sha256")
      - name: Upload run artifact
        uses: actions/upload-artifact@v7
        with:
          name: shiraz-browser-kit-${{ needs.version.outputs.version }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/Shiraz-Browser-Base-*-${{ matrix.arch }}.AppImage
            dist/Shiraz-Browser-Base-*-${{ matrix.arch }}.AppImage.sha256
            dist/shiraz-web_*_amd64.deb
            dist/shiraz-web_*_amd64.deb.sha256
            go-wasm/shiraz-assemble.wasm
            go-wasm/wasm_exec.js
            go-wasm/fonts/Manrope-wght.ttf

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: shiraz-browser-kit-${{ needs.version.outputs.version }}-*
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Build SvelteKit landing and integrated builder
        env:
          BASE_PATH: /shiraz
          SHIRAZ_PREBUILT_WASM: '1'
        run: |
          npm ci --prefix landing
          npm --prefix landing run check
          npm --prefix landing run build
      - name: Package both architectures for Pages and releases
        run: python3 scripts/package_browser_site.py
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          version=$(cat VERSION)
          tag="v${version}"
          assets=(dist/Shiraz-Browser-Base-${version}-*.AppImage dist/Shiraz-Browser-Base-${version}-*.AppImage.sha256
                  "dist/Shiraz-Browser-Builder-${version}.zip" dist/shiraz-web_*_amd64.deb dist/shiraz-web_*_amd64.deb.sha256)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$RELEASE_SHA" --title "Shiraz ${version}" --prerelease \
              --notes "Native x86_64 and ARM64 Shiraz base AppImages, browser WASM assembler, and amd64 Debian web package. App and Linux phone compatibility remain experimental."
          fi
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages-site

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
