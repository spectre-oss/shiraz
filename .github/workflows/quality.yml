name: Code quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-server/go.mod
          cache: false
      - run: make init
      - name: Check changed source files
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          elif [ -n "$PUSH_BASE" ] && [[ ! "$PUSH_BASE" =~ ^0+$ ]]; then
            base="$PUSH_BASE"
          else
            base=$(git hash-object -t tree /dev/null)
          fi
          make lint-ci BASE="$base"
      - name: Python tests
        env:
          PYTHONPATH: src
        run: |
          python3 -m pip install -r config/test-requirements.txt
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Native analysis of dependency-free host targets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bear clang
          mkdir -p build
          bear --output build/compile_commands.json -- make -B build/test-compositor build/test-pointer CXX=clang++
          # bear also records clang's internal -cc1 job for each file; clang-tidy
          # cannot replay that as a driver command, so keep the driver entries only.
          python3 - build/compile_commands.json <<'PY'
          import json
          import shlex
          import sys

          path = sys.argv[1]
          with open(path, encoding='utf-8') as handle:
              entries = json.load(handle)
          kept = [
              entry
              for entry in entries
              if '-cc1' not in (entry.get('arguments') or shlex.split(entry.get('command', '')))
          ]
          if not kept:
              raise SystemExit('No compiler driver entries in compile_commands.json')
          with open(path, 'w', encoding='utf-8') as handle:
              json.dump(kept, handle, indent=2)
          print(f'Kept {len(kept)} of {len(entries)} compile database entries')
          PY
          make lint-cpp

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [go-server, go-wasm, go-wasm/launcher]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-server/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vet and test module
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          if [ "$PWD" = "$GITHUB_WORKSPACE/go-wasm" ]; then
            export GOOS=js GOARCH=wasm
            export SHIRAZ_WASM_GOROOT="$(go env GOROOT)"
            go vet ./...
            go test -exec="python3 ../scripts/run_wasm_test.py" ./...
          else
            go vet ./...
            go test ./...
          fi

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci --prefix landing
      - run: npm --prefix landing run check
